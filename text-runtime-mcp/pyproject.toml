[project]
name = "text-runtime-mcp"
version = "0.1.0"
description = "MCP server exposing the text-runtime engine to goose agents"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.13"
keywords = [
    "mcp",
    "model-context-protocol",
    "text-runtime",
    "goose",
    "annotations",
    "pandoc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "mcp[cli]>=1.25.0,<2.0",
]

[project.scripts]
text-runtime-mcp = "text_runtime_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
